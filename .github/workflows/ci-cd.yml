name: Online Auction CI/CD

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  # JOB 1: Xây dựng và chạy Unit Test
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v3

      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Grant execute permission for mvnw
        run: chmod +x mvnw

      # Lưu ý quan trọng: Vì dự án dùng JavaFX, chạy test trên Ubuntu Server (không có giao diện)
      # sẽ bị lỗi HeadlessException. Ta cần dùng 'xvfb-run' để tạo màn hình ảo.
      - name: Install Xvfb (Virtual Framebuffer)
        run: sudo apt-get install xvfb

      - name: Run Maven Tests with Xvfb
        run: xvfb-run ./mvnw clean test

  # JOB 2: Đóng gói Client JavaFX thành file ZIP chạy độc lập
  package-client:
    needs: build-and-test # Chỉ chạy khi build-and-test thành công
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v3

      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build JavaFX App using jlink
        run: ./mvnw clean javafx:jlink

      - name: Upload Client Artifact
        uses: actions/upload-artifact@v3
        with:
          name: online-auction-client
          # Đường dẫn sinh ra file zip dựa theo cấu hình jlinkZipName trong pom.xml của bạn
          path: target/app.zip